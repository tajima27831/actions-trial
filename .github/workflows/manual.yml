name: Deploy Python Generated HTML to GitHub Pages

on:
  workflow_dispatch:

# GitHub Pagesの自動デプロイに必要なアクセス権限
permissions:
  contents: write

# 連続Push時に古い実行を自動キャンセルして最新ビルドを優先
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードを作業領域にチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Python環境のセットアップ (今回のスクリプトは標準ライブラリのみで動作するため pip install は不要)
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 3. Pythonスクリプトを実行して content/*.md から dist/*.html を生成
      - name: Run Python
        run: python scripts/test.py
      
      # 4. 変更したファイルをpush
      - name: Git Setup
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: auto-update output.txt via GitHub Actions"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi